[project]
name = "support-rag"
version = "0.1.0"
description = "Customer-support chatbot with retrieval-augmented generation and hallucination detection."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Web layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",

    # Vector store
    "chromadb>=0.5.5",

    # Embeddings + NLI (local, CPU-friendly)
    "sentence-transformers>=3.0",

    # Local LLM client (Ollama is the default backend)
    "ollama>=0.3.3",
    "httpx>=0.27",

    # Document loading
    "markdown-it-py>=3.0",
    "pypdf>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]
# Drop-in providers (optional; the codebase works without them)
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]

[project.scripts]
support-rag-ingest = "app.ingestion.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Conservative ruleset — pyflakes (real bugs) + pycodestyle errors + import order.
select = ["E", "F", "W", "I"]
# E501 is line-too-long. Trip-prone on long prompt strings; we already cap at 100.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
